name: SoundSwitch plug-in build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/soundswitch-plugin.yml'
      - 'qlcplus/plugins/soundswitch/**'
  push:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/soundswitch-plugin.yml'
      - 'qlcplus/plugins/soundswitch/**'

permissions:
  contents: read

concurrency:
  group: soundswitch-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QLCPLUS_SOURCE_COMMIT: a124abebe0b5ad6077727c561a5a0e1f3730810c
  QT_VERSION: 6.8.1

jobs:
  build-windows:
    name: Windows x64 matched plug-in
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install matched Qt and MinGW kit
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Fetch pinned QLC+ plug-in interface
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/mcallegari/qlcplus.git qlcplus-pinned
          git -C qlcplus-pinned checkout --detach $env:QLCPLUS_SOURCE_COMMIT
          Copy-Item -Recurse -Force qlcplus-pinned/plugins/interfaces qlcplus/plugins/interfaces
          $head = git -C qlcplus-pinned rev-parse HEAD
          if ($head -ne $env:QLCPLUS_SOURCE_COMMIT) {
            throw "QLC+ source mismatch: $head"
          }

      - name: Configure focused build
        shell: pwsh
        run: |
          $qtRoot = Split-Path (Split-Path $env:QTDIR -Parent) -Parent
          $toolBin = Join-Path $qtRoot 'Tools/mingw1310_64/bin'
          $compiler = Join-Path $toolBin 'g++.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Matched MinGW compiler not found: $compiler"
          }
          $env:Path = "$toolBin;$env:Path"
          cmake -S qlcplus/plugins/soundswitch/standalone -B build-soundswitch -G Ninja `
            "-DCMAKE_PREFIX_PATH=$env:QTDIR/lib/cmake" `
            "-DCMAKE_C_COMPILER=$(Join-Path $toolBin 'gcc.exe')" `
            "-DCMAKE_CXX_COMPILER=$compiler" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build plug-in and deterministic tests
        shell: pwsh
        run: |
          cmake --build build-soundswitch --target `
            soundswitch `
            soundswitch_protocol_tests `
            soundswitch_intensity_tests `
            ss_smoke `
            --parallel

      - name: Run software tests
        shell: pwsh
        run: |
          $env:Path = "$env:QTDIR/bin;$env:Path"
          $protocol = Get-ChildItem -Recurse build-soundswitch -Filter soundswitch_protocol_tests.exe | Select-Object -First 1
          $intensity = Get-ChildItem -Recurse build-soundswitch -Filter soundswitch_intensity_tests.exe | Select-Object -First 1
          $smoke = Get-ChildItem -Recurse build-soundswitch -Filter soundswitch_plugin_smoke_tests.exe | Select-Object -First 1
          $plugin = Get-ChildItem -Recurse build-soundswitch -Filter soundswitch.dll | Select-Object -First 1
          foreach ($file in @($protocol, $intensity, $smoke, $plugin)) {
            if ($null -eq $file) { throw 'A required build product is missing.' }
          }
          & $protocol.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $intensity.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $smoke.FullName $plugin.FullName --allow-no-hardware
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage matched binary and evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $plugin = Get-ChildItem -Recurse build-soundswitch -Filter soundswitch.dll | Select-Object -First 1
          Copy-Item -LiteralPath $plugin.FullName artifact/soundswitch.dll
          $hash = (Get-FileHash artifact/soundswitch.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            qlcplusSourceCommit = $env:QLCPLUS_SOURCE_COMMIT
            qtVersion = $env:QT_VERSION
            architecture = 'windows-x64-mingw'
            workflowRun = '${{ github.run_id }}'
            repositoryCommit = '${{ github.sha }}'
            soundswitchSha256 = $hash
            protocolTests = 'passed'
            intensityTests = 'passed'
            abiSmoke = 'passed-without-hardware'
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM artifact/build-evidence.json
          "$hash  soundswitch.dll" | Set-Content -Encoding ascii artifact/SHA256SUMS.txt

      - name: Upload matched plug-in
        uses: actions/upload-artifact@v4
        with:
          name: soundswitch-v27-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: artifact/*
