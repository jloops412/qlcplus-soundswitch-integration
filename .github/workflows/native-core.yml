name: Native core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # actions/checkout's default PR ref is GitHub's synthetic merge commit. The
  # product/payload identity must name that exact checked-out tree, while the
  # contributor head remains separate provenance rather than being mislabeled.
  EMBERLIGHTS_SOURCE_COMMIT: ${{ github.sha }}
  EMBERLIGHTS_SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: native-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Test Windows package contract
        run: python -m unittest installer/test_windows_package_contract.py

      - name: Configure
        run: cmake -S native-core -B native-core/build-ci -DCMAKE_BUILD_TYPE=Release "-DEMBERLIGHTS_VERSION=0.1.0-ci.${{ github.run_number }}" "-DEMBERLIGHTS_COMMIT=${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"

      - name: Build
        run: cmake --build native-core/build-ci --config Release --parallel

      - name: Test
        run: ctest --test-dir native-core/build-ci --build-config Release --output-on-failure

  package-windows:
    name: Windows installer
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.1.0-preview.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Verify package checkout identity
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $declared = "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}".ToLowerInvariant()
          if ($actual -ne $declared) {
            throw "Checked-out commit $actual does not match declared package commit $declared."
          }

      - name: Configure
        run: cmake -S native-core -B native-core/build-package -DCMAKE_BUILD_TYPE=Release "-DEMBERLIGHTS_VERSION=${{ steps.version.outputs.value }}" "-DEMBERLIGHTS_COMMIT=${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"

      - name: Build
        run: cmake --build native-core/build-package --config Release --parallel

      - name: Test packaged build
        run: ctest --test-dir native-core/build-package --build-config Release --output-on-failure

      - name: Stage and attest Windows payload
        shell: pwsh
        run: |
          cmake --install native-core/build-package --config Release --prefix "$PWD/stage"
          python installer/windows_package_contract.py create `
            --root "$PWD/stage" `
            --version "${{ steps.version.outputs.value }}" `
            --commit "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python installer/windows_package_contract.py verify `
            --root "$PWD/stage" `
            --expected-version "${{ steps.version.outputs.value }}" `
            --expected-commit "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$PWD/stage/*" -DestinationPath "$PWD/EmberLights-${{ steps.version.outputs.value }}-Portable.zip"

      - name: Verify portable application
        shell: pwsh
        run: |
          $portableDir = Join-Path $PWD "portable-smoke"
          Expand-Archive `
            -LiteralPath "$PWD/EmberLights-${{ steps.version.outputs.value }}-Portable.zip" `
            -DestinationPath $portableDir
          python installer/windows_package_contract.py verify `
            --root $portableDir `
            --expected-version "${{ steps.version.outputs.value }}" `
            --expected-commit "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $application = Join-Path $portableDir "EmberLights.exe"
          $launch = Start-Process `
            -FilePath $application `
            -ArgumentList "--startup-smoke" `
            -PassThru `
            -Wait
          if ($launch.ExitCode -ne 0) {
            throw "Portable GUI startup smoke test failed with exit code $($launch.ExitCode)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $iscc "/DBuildDir=$PWD/stage" "/DAppVersion=${{ steps.version.outputs.value }}" "installer/EmberLights.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, verify, smoke, and uninstall Windows application
        shell: pwsh
        run: |
          $installer = Resolve-Path "installer/output/EmberLights-${{ steps.version.outputs.value }}-Setup.exe"
          $installDir = Join-Path $PWD "installed-smoke"
          $setup = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDir"
          ) -PassThru -Wait
          if ($setup.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($setup.ExitCode)."
          }
          python installer/windows_package_contract.py verify `
            --root $installDir `
            --expected-version "${{ steps.version.outputs.value }}" `
            --expected-commit "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}" `
            --layout inno-installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $application = Join-Path $installDir "EmberLights.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "The installer did not produce EmberLights.exe."
          }
          $associationPath = "Registry::HKEY_CURRENT_USER\Software\Classes\EmberLights.Project\shell\open\command"
          if (-not (Test-Path -LiteralPath $associationPath)) {
            throw "The installer did not register the .emberlights open command."
          }
          $association = (Get-Item -LiteralPath $associationPath).GetValue("")
          $expectedAssociation = '"' + $application + '" "%1"'
          if ($association -ne $expectedAssociation) {
            throw "Unexpected .emberlights open command: $association"
          }
          $launch = Start-Process -FilePath $application -ArgumentList "--startup-smoke" -PassThru -Wait
          if ($launch.ExitCode -ne 0) {
            throw "Installed GUI startup smoke test failed with exit code $($launch.ExitCode)."
          }
          $probe = Join-Path $installDir "Tools/soundswitch_micro_probe.exe"
          if (-not (Test-Path -LiteralPath $probe -PathType Leaf)) {
            throw "The installer did not produce the SoundSwitch Micro probe."
          }
          $probeTest = Start-Process -FilePath $probe -ArgumentList "--self-test" -PassThru -Wait
          if ($probeTest.ExitCode -ne 0) {
            throw "Installed SoundSwitch Micro probe self-test failed with exit code $($probeTest.ExitCode)."
          }
          $controlOneProbe = Join-Path $installDir "Tools/soundswitch_control_one_probe.exe"
          if (-not (Test-Path -LiteralPath $controlOneProbe -PathType Leaf)) {
            throw "The installer did not produce the Control One DMX probe."
          }
          $controlOneTest = Start-Process -FilePath $controlOneProbe -ArgumentList "--self-test" -PassThru -Wait
          if ($controlOneTest.ExitCode -ne 0) {
            throw "Installed Control One DMX probe self-test failed with exit code $($controlOneTest.ExitCode)."
          }
          $qualificationReport = Join-Path $PWD "installed-smoke-qualification.json"
          $qualification = Join-Path $installDir "Tools/emberlights_qualify.exe"
          $qualificationTest = Start-Process -FilePath $qualification -ArgumentList @(
            "--duration",
            "2",
            "--report",
            $qualificationReport
          ) -PassThru -Wait
          if ($qualificationTest.ExitCode -ne 0) {
            throw "Installed non-outputting qualification smoke failed with exit code $($qualificationTest.ExitCode)."
          }
          $report = Get-Content -LiteralPath $qualificationReport -Raw | ConvertFrom-Json
          if ($report.verdict -ne "pass" -or
              $report.platform -ne "windows" -or
              $report.networkLoopback -ne $false -or
              $report.productVersion -ne "${{ steps.version.outputs.value }}" -or
              $report.commit -ne "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}") {
            throw "Installed qualification report identity, platform, output policy, or verdict is invalid."
          }
          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter "unins*.exe" |
            Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw "The installer did not produce an Inno Setup uninstaller."
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstall smoke test failed with exit code $($uninstall.ExitCode)."
          }
          $uninstallDeadline = (Get-Date).AddSeconds(10)
          while ((Test-Path -LiteralPath $installDir) -and
                 (Get-Date) -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $installDir) {
            throw "Uninstall left the isolated application directory behind."
          }
          if ((Test-Path -LiteralPath $associationPath) -or
              (Test-Path -LiteralPath "Registry::HKEY_CURRENT_USER\Software\Classes\.emberlights")) {
            throw "Uninstall left the EmberLights file association behind."
          }

      - name: Generate release evidence
        shell: pwsh
        run: |
          $releaseDir = "release-artifacts"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          $setupName = "EmberLights-${{ steps.version.outputs.value }}-Setup.exe"
          $portableName = "EmberLights-${{ steps.version.outputs.value }}-Portable.zip"
          $payloadName = "EmberLights-${{ steps.version.outputs.value }}-Windows-payload-manifest.json"
          $qualificationName = "EmberLights-${{ steps.version.outputs.value }}-Windows-qualification-smoke.json"
          $setup = Join-Path $releaseDir $setupName
          $portable = Join-Path $releaseDir $portableName
          $payload = Join-Path $releaseDir $payloadName
          $qualification = Join-Path $releaseDir $qualificationName
          $checksums = Join-Path $releaseDir "EmberLights-${{ steps.version.outputs.value }}-SHA256SUMS.txt"
          $manifest = Join-Path $releaseDir "EmberLights-${{ steps.version.outputs.value }}-release-manifest.json"
          Copy-Item "installer/output/$setupName" $setup
          Copy-Item $portableName $portable
          Copy-Item "stage/EmberLights-Windows-payload-manifest.json" $payload
          Copy-Item "installed-smoke-qualification.json" $qualification
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable).Hash.ToLowerInvariant()
          $payloadHash = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLowerInvariant()
          $qualificationHash = (Get-FileHash -Algorithm SHA256 $qualification).Hash.ToLowerInvariant()
          @(
            "$setupHash  $setupName"
            "$portableHash  $portableName"
            "$payloadHash  $payloadName"
            "$qualificationHash  $qualificationName"
          ) | Set-Content -Encoding ascii $checksums
          [ordered]@{
            format = "emberlights-release-manifest"
            formatVersion = 2
            product = "EmberLights"
            platform = "windows-x64"
            version = "${{ steps.version.outputs.value }}"
            commit = "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"
            sourceHeadCommit = "${{ env.EMBERLIGHTS_SOURCE_HEAD_COMMIT }}"
            buildCommit = "${{ github.sha }}"
            workflowRun = "${{ github.run_id }}"
            projectFormatVersion = 1
            showPackageSchemaVersion = 4
            qualificationSmoke = "passed"
            packageContract = [ordered]@{
              formatVersion = 1
              staged = "passed"
              portable = "passed"
              installed = "passed"
              manifest = $payloadName
              sha256 = $payloadHash
            }
            installedQualification = [ordered]@{
              output = "disabled"
              report = $qualificationName
              sha256 = $qualificationHash
            }
            installerLifecycle = [ordered]@{
              cleanInstall = "passed"
              guiStartup = "passed"
              probeSelfTests = "passed"
              fileAssociation = "passed"
              uninstall = "passed"
              upgrade = "not-run"
              rollback = "not-run"
            }
            artifacts = @(
              [ordered]@{ file = $setupName; sha256 = $setupHash }
              [ordered]@{ file = $portableName; sha256 = $portableHash }
              [ordered]@{ file = $payloadName; sha256 = $payloadHash }
              [ordered]@{ file = $qualificationName; sha256 = $qualificationHash }
            )
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM $manifest

      - name: Verify release evidence
        shell: pwsh
        run: |
          Push-Location release-artifacts
          try {
            $checksumFile = Get-Item "EmberLights-*-SHA256SUMS.txt"
            foreach ($line in Get-Content $checksumFile) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
                throw "Malformed checksum line: $line"
              }
              $expected = $Matches[1]
              $artifact = $Matches[2]
              if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
                throw "Checksum target is missing from release root: $artifact"
              }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                throw "Checksum mismatch for $artifact"
              }
            }
            $manifest = Get-Content (Get-Item "EmberLights-*-release-manifest.json") -Raw | ConvertFrom-Json
            if ($manifest.formatVersion -ne 2 -or
                $manifest.platform -ne "windows-x64" -or
                $manifest.version -ne "${{ steps.version.outputs.value }}" -or
                $manifest.commit -ne "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}" -or
                $manifest.sourceHeadCommit -ne "${{ env.EMBERLIGHTS_SOURCE_HEAD_COMMIT }}" -or
                $manifest.qualificationSmoke -ne "passed" -or
                $manifest.packageContract.installed -ne "passed" -or
                $manifest.installerLifecycle.upgrade -ne "not-run" -or
                $manifest.installerLifecycle.rollback -ne "not-run") {
              throw "Release manifest identity, evidence, or honest lifecycle boundary is invalid."
            }
            foreach ($artifact in $manifest.artifacts) {
              if (-not (Test-Path -LiteralPath $artifact.file -PathType Leaf)) {
                throw "Manifest target is missing from release root: $($artifact.file)"
              }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.file).Hash.ToLowerInvariant()
              if ($actual -ne $artifact.sha256) {
                throw "Manifest checksum mismatch for $($artifact.file)"
              }
            }
            $payload = Get-Content -LiteralPath $manifest.packageContract.manifest -Raw | ConvertFrom-Json
            if ($payload.format -ne "emberlights-windows-payload-manifest" -or
                $payload.formatVersion -ne 1 -or
                $payload.version -ne $manifest.version -or
                $payload.commit -ne $manifest.commit -or
                $payload.safetyBoundary.defaultOutput -ne "disabled" -or
                $payload.safetyBoundary.selfTests -ne "non-outputting" -or
                $payload.safetyBoundary.physicalQualification -ne "not-claimed") {
              throw "Windows payload manifest identity or safety boundary is invalid."
            }
            $qualification = Get-Content -LiteralPath $manifest.installedQualification.report -Raw | ConvertFrom-Json
            if ($qualification.verdict -ne "pass" -or
                $qualification.platform -ne "windows" -or
                $qualification.networkLoopback -ne $false -or
                $qualification.productVersion -ne $manifest.version -or
                $qualification.commit -ne $manifest.commit) {
              throw "Installed qualification evidence is invalid or does not match the release."
            }
          } finally {
            Pop-Location
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmberLights-${{ steps.version.outputs.value }}-Windows
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/*

  package-linux:
    name: Linux installer
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="0.1.0-preview.${{ github.run_number }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S native-core -B native-core/build-package-linux -DCMAKE_BUILD_TYPE=Release "-DEMBERLIGHTS_VERSION=${{ steps.version.outputs.value }}" "-DEMBERLIGHTS_COMMIT=${{ env.EMBERLIGHTS_SOURCE_COMMIT }}"

      - name: Build
        run: cmake --build native-core/build-package-linux --parallel

      - name: Test packaged build
        run: ctest --test-dir native-core/build-package-linux --output-on-failure

      - name: Build Linux packages
        run: |
          mkdir -p package-linux
          cpack --config native-core/build-package-linux/CPackConfig.cmake -G DEB -B "$PWD/package-linux"
          cpack --config native-core/build-package-linux/CPackConfig.cmake -G TGZ -B "$PWD/package-linux"

      - name: Install and run packaged tools
        shell: bash
        run: |
          deb="$(find package-linux -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo dpkg --install "$deb"
          runner_lab --os2l-port 0 --duration 1 --manual-bpm 120
          emberlights_qualify --duration 2 --network-loopback --report qualification-installed.json
          emberlights_migrate --help
          midi_capture --list
          sudo dpkg --remove emberlights
          ! command -v runner_lab

      - name: Generate and verify release evidence
        shell: bash
        run: |
          release_dir="release-artifacts-linux"
          mkdir -p "$release_dir"
          mapfile -t packages < <(find package-linux -maxdepth 1 -type f \( -name '*.deb' -o -name '*.tar.gz' \) -print | sort)
          test "${#packages[@]}" -eq 2
          cp "${packages[@]}" "$release_dir/"
          checksum_file="$release_dir/EmberLights-${{ steps.version.outputs.value }}-Linux-SHA256SUMS.txt"
          manifest="$release_dir/EmberLights-${{ steps.version.outputs.value }}-Linux-release-manifest.json"
          (
            cd "$release_dir"
            sha256sum -- *.deb *.tar.gz > "$(basename "$checksum_file")"
            sha256sum --check "$(basename "$checksum_file")"
          )
          deb_name="$(basename "${packages[0]}")"
          archive_name="$(basename "${packages[1]}")"
          if [[ "$deb_name" != *.deb ]]; then
            tmp="$deb_name"; deb_name="$archive_name"; archive_name="$tmp"
          fi
          deb_hash="$(sha256sum "$release_dir/$deb_name" | cut -d' ' -f1)"
          archive_hash="$(sha256sum "$release_dir/$archive_name" | cut -d' ' -f1)"
          jq -n \
            --arg version "${{ steps.version.outputs.value }}" \
            --arg commit "${{ env.EMBERLIGHTS_SOURCE_COMMIT }}" \
            --arg buildCommit "${{ github.sha }}" \
            --arg workflowRun "${{ github.run_id }}" \
            --arg deb "$deb_name" \
            --arg debHash "$deb_hash" \
            --arg archive "$archive_name" \
            --arg archiveHash "$archive_hash" \
            '{format:"emberlights-release-manifest",formatVersion:1,product:"EmberLights",platform:"linux",version:$version,commit:$commit,buildCommit:$buildCommit,workflowRun:$workflowRun,projectFormatVersion:1,showPackageSchemaVersion:4,qualificationSmoke:"passed",artifacts:[{file:$deb,sha256:$debHash},{file:$archive,sha256:$archiveHash}]}' \
            > "$manifest"
          jq -e '.qualificationSmoke == "passed" and (.artifacts | length) == 2' "$manifest" >/dev/null

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: EmberLights-${{ steps.version.outputs.value }}-Linux
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts-linux/*

  release:
    name: Publish tagged release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged application
        uses: actions/download-artifact@v4
        with:
          pattern: EmberLights-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            EmberLights-*-Setup.exe
            EmberLights-*-Portable.zip
            EmberLights-*-Linux-*.deb
            EmberLights-*-Linux-*.tar.gz
            EmberLights-*-SHA256SUMS.txt
            EmberLights-*-Windows-payload-manifest.json
            EmberLights-*-Windows-qualification-smoke.json
            EmberLights-*-release-manifest.json
