name: Native core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native-core -B native-core/build-ci -DCMAKE_BUILD_TYPE=Release "-DEMBERLIGHTS_VERSION=0.1.0-ci.${{ github.run_number }}" "-DEMBERLIGHTS_COMMIT=${{ github.sha }}"

      - name: Build
        run: cmake --build native-core/build-ci --config Release --parallel

      - name: Test
        run: ctest --test-dir native-core/build-ci --build-config Release --output-on-failure

  package-windows:
    name: Windows installer
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.1.0-preview.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S native-core -B native-core/build-package -DCMAKE_BUILD_TYPE=Release "-DEMBERLIGHTS_VERSION=${{ steps.version.outputs.value }}" "-DEMBERLIGHTS_COMMIT=${{ github.sha }}"

      - name: Build
        run: cmake --build native-core/build-package --config Release --parallel

      - name: Test packaged build
        run: ctest --test-dir native-core/build-package --build-config Release --output-on-failure

      - name: Stage portable application
        shell: pwsh
        run: |
          cmake --install native-core/build-package --config Release --prefix "$PWD/stage"
          Compress-Archive -Path "$PWD/stage/*" -DestinationPath "$PWD/EmberLights-${{ steps.version.outputs.value }}-Portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $iscc "/DBuildDir=$PWD/stage" "/DAppVersion=${{ steps.version.outputs.value }}" "installer/EmberLights.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate release evidence
        shell: pwsh
        run: |
          $setup = "installer/output/EmberLights-${{ steps.version.outputs.value }}-Setup.exe"
          $portable = "EmberLights-${{ steps.version.outputs.value }}-Portable.zip"
          $checksums = "EmberLights-${{ steps.version.outputs.value }}-SHA256SUMS.txt"
          $manifest = "EmberLights-${{ steps.version.outputs.value }}-release-manifest.json"
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable).Hash.ToLowerInvariant()
          @(
            "$setupHash  $(Split-Path -Leaf $setup)"
            "$portableHash  $(Split-Path -Leaf $portable)"
          ) | Set-Content -Encoding ascii $checksums
          [ordered]@{
            format = "emberlights-release-manifest"
            formatVersion = 1
            product = "EmberLights"
            version = "${{ steps.version.outputs.value }}"
            commit = "${{ github.sha }}"
            workflowRun = "${{ github.run_id }}"
            projectFormatVersion = 1
            showPackageSchemaVersion = 4
            qualificationSmoke = "passed"
            artifacts = @(
              [ordered]@{ file = (Split-Path -Leaf $setup); sha256 = $setupHash }
              [ordered]@{ file = (Split-Path -Leaf $portable); sha256 = $portableHash }
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM $manifest

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmberLights-${{ steps.version.outputs.value }}-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            installer/output/EmberLights-${{ steps.version.outputs.value }}-Setup.exe
            EmberLights-${{ steps.version.outputs.value }}-Portable.zip
            EmberLights-${{ steps.version.outputs.value }}-SHA256SUMS.txt
            EmberLights-${{ steps.version.outputs.value }}-release-manifest.json

  release:
    name: Publish tagged release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged application
        uses: actions/download-artifact@v4
        with:
          pattern: EmberLights-*-Windows
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            EmberLights-*-Setup.exe
            EmberLights-*-Portable.zip
            EmberLights-*-SHA256SUMS.txt
            EmberLights-*-release-manifest.json
