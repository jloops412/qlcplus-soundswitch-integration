name: QLC+ V26 and V27 validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlcplus-workspaces-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  V26_WORKSPACE: releases/qlcplus-control-one/v26/IR4-TUBES-CONTROL-ONE-V26-AUTOPLAY-CLARITY.qxw
  V26_SHA256: ed97e3ebaea120bc6ff5ff9747485da54e1808479f64a02ab4bc044744fab570
  V27_GENERATED_WORKSPACE: qlcplus/workspace-tools/IR4-TUBES-WASH-FOCUS-CONTROL-ONE-V27-FULL-RIG.qxw
  V27_PACKAGED_WORKSPACE: releases/qlcplus-control-one/v27/IR4-TUBES-WASH-FOCUS-CONTROL-ONE-V27-FULL-RIG.qxw

jobs:
  repository-hygiene:
    name: Repository scope and contributor files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require active project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CONTRIBUTING.md
            SECURITY.md
            THIRD_PARTY_NOTICES.md
            docs/00_START_HERE.md
            docs/DEVELOPMENT.md
            docs/qlcplus-control-one/PROJECT_STATUS_AND_ROADMAP.md
            releases/qlcplus-control-one/v26/Test-V26Package.ps1
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Reject unrelated application paths
        shell: bash
        run: |
          set -euo pipefail
          excluded=(
            native-core
            installer
            profiles
            research
            spec
            soundswitch-replacement-product-ledger.md
            .github/workflows/native-core.yml
            .github/workflows/qlcplus-v21.yml
          )
          for path in "${excluded[@]}"; do
            test ! -e "$path" || { echo "Out-of-scope path found on main: $path"; exit 1; }
          done

      - name: Check scope declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'QLC+ owns fixture profiles and patches' README.md
          grep -Fq 'QLC+ is the lighting runtime' CONTRIBUTING.md
          grep -Fq 'This project integrates SoundSwitch Micro and Control One hardware with QLC+.' docs/00_START_HERE.md

  package-validation:
    name: V26 package and source manifest
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate V26 package
        shell: pwsh
        run: releases/qlcplus-control-one/v26/Test-V26Package.ps1

      - name: Validate V26 workspace
        shell: pwsh
        run: |
          qlcplus/workspace-tools/Test-V26Workspace.ps1 `
            -SourceWorkspace qlcplus/workspace-tools/IR4-TUBES-CONTROL-ONE-V25-LEAN-FEEDBACK.qxw `
            -CandidateWorkspace releases/qlcplus-control-one/v26/IR4-TUBES-CONTROL-ONE-V26-AUTOPLAY-CLARITY.qxw

      - name: Verify SoundSwitch source manifest
        shell: pwsh
        run: |
          $root = Resolve-Path 'qlcplus/plugins/soundswitch'
          foreach ($line in Get-Content "$root/SHA256SUMS.txt") {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Malformed source checksum line: $line"
            }
            $target = Join-Path $root $Matches[2]
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Source checksum target is missing: $($Matches[2])"
            }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) {
              throw "Source checksum mismatch: $($Matches[2])"
            }
          }

  v27-workspace-validation:
    name: V27 deterministic full-rig workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify immutable V26 release source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$V26_WORKSPACE"
          actual="$(sha256sum "$V26_WORKSPACE" | awk '{print $1}')"
          if [[ "$actual" != "$V26_SHA256" ]]; then
            echo "V26 workspace SHA-256 mismatch: expected $V26_SHA256, found $actual"
            exit 1
          fi

      - name: Prove the forced V27 build is deterministic
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 qlcplus/workspace-tools/Build-V27FullRig.py --force
          cp "$V27_GENERATED_WORKSPACE" "$RUNNER_TEMP/v27-first-build.qxw"
          python3 qlcplus/workspace-tools/Build-V27FullRig.py --force
          if ! cmp -s "$RUNNER_TEMP/v27-first-build.qxw" "$V27_GENERATED_WORKSPACE"; then
            echo "Two forced V27 builds produced different workspaces."
            sha256sum "$RUNNER_TEMP/v27-first-build.qxw" "$V27_GENERATED_WORKSPACE"
            exit 1
          fi

      - name: Validate the generated V27 workspace
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 qlcplus/workspace-tools/Test-V27Workspace.py \
            --source-workspace "$V26_WORKSPACE" \
            --candidate-workspace "$V27_GENERATED_WORKSPACE" \
            --focus-definition qlcplus/fixture-definitions/American-DJ-Focus-Spot-Two.qxf

      - name: Compare generated and packaged V27 workspaces
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$V27_PACKAGED_WORKSPACE" ]]; then
            if ! cmp -s "$V27_GENERATED_WORKSPACE" "$V27_PACKAGED_WORKSPACE"; then
              echo "Packaged V27 workspace does not match the reproducible build."
              sha256sum "$V27_GENERATED_WORKSPACE" "$V27_PACKAGED_WORKSPACE"
              exit 1
            fi
            sha256sum "$V27_PACKAGED_WORKSPACE"
          else
            echo "Packaged V27 workspace is not present; comparison skipped."
          fi

  v27-package-validation:
    name: V27 Windows release package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate V27 package
        shell: pwsh
        run: releases/qlcplus-control-one/v27/Test-V27Package.ps1
