name: V30 working copy

on:
  push:
    branches:
      - fix/v30-performance-controls
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v30-working-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Stage editable project tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -a .github artifact/
          cp -a docs artifact/
          cp -a qlcplus artifact/
          mkdir -p artifact/releases/qlcplus-control-one
          cp -a releases/qlcplus-control-one/v27 artifact/releases/qlcplus-control-one/
          printf '%s\n' "${GITHUB_SHA}" > artifact/SOURCE_COMMIT.txt

      - name: Upload working copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v30-working-copy-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          compression-level: 0
          path: artifact
