name: V35 source snapshot

on:
  push:
    branches: [fix/v35-native-playback-timing]
    paths:
      - '.github/workflows/v35-source-snapshot.yml'
      - 'qlcplus/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: integration
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mcallegari/qlcplus
          ref: a124abebe0b5ad6077727c561a5a0e1f3730810c
          persist-credentials: false
          path: upstream
      - name: Capture exact implementation, workspace, and pinned engine inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v35-source/integration v35-source/upstream
          cd integration
          cp --parents \
            qlcplus/patches/0001-os2l-use-reported-bpm.patch \
            qlcplus/input-profiles/SoundSwitch-Control-One-Performance.qxi \
            qlcplus/plugins/soundswitch/CMakeLists.txt \
            qlcplus/plugins/soundswitch/soundswitchmidiinput.cpp \
            qlcplus/plugins/soundswitch/soundswitchmidiinput.h \
            qlcplus/plugins/soundswitch/tests/CMakeLists.txt \
            qlcplus/plugins/soundswitch/tests/soundswitchmiditest.cpp \
            qlcplus/plugins/soundswitch/tests/soundswitchmiditestbackend.h \
            qlcplus/tests/v34-native/CMakeLists.txt \
            qlcplus/tests/v34-native/native_contract.cpp \
            qlcplus/tests/v34-native/run_and_record.py \
            qlcplus/workspace-tools/Build-V34Reliability.py \
            qlcplus/workspace-tools/Test-V34Workspace.py \
            qlcplus/workspace-tools/Build-V34TestingPackage.py \
            qlcplus/workspace-tools/IR4-TUBES-WASH-FOCUS-CONTROL-ONE-V34-RELIABILITY.qxw \
            ../v35-source/integration/
          cd ../upstream
          cp --parents \
            engine/src/chaserrunner.cpp \
            engine/src/chaserrunner.h \
            engine/src/chaser.cpp \
            engine/src/chaser.h \
            engine/src/function.cpp \
            engine/src/function.h \
            engine/src/mastertimer.cpp \
            engine/src/mastertimer.h \
            engine/test/chaser_test.cpp \
            engine/test/chaser_test.h \
            plugins/os2l/src/os2l.cpp \
            plugins/os2l/src/os2l.h \
            plugins/os2l/test/os2l_test.cpp \
            ../v35-source/upstream/
          cd ..
          grep -RInE 'beat|Beat|tempo|Tempo|duration|Duration|seek|Seek|pause|Pause|autoplay|Auto Bank|Profile|Track|Next|Previous' \
            integration/qlcplus/plugins/soundswitch integration/qlcplus/patches \
            integration/qlcplus/tests/v34-native integration/qlcplus/workspace-tools \
            upstream/engine/src upstream/plugins/os2l/src \
            > v35-source/search-index.txt || true
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v35-source-snapshot
          path: v35-source
          if-no-files-found: error
