name: QLC+ SoundSwitch V21

on:
  push:
    branches: [main]
    tags: [v21]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlcplus-v21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify hashes, XML, fixture patch, bindings and V20 preservation
        shell: pwsh
        run: |
          releases/qlcplus-control-one/v21/Test-V21Package.ps1 `
            -BaselineWorkspace releases/qlcplus-control-one/v20/IR4-TUBES-CONTROL-ONE-V20-UIUX-PORTABLE.qxw

      - name: Verify source manifest
        shell: pwsh
        run: |
          $root = Resolve-Path 'qlcplus/plugins/soundswitch'
          foreach ($line in Get-Content "$root/SHA256SUMS.txt") {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Malformed source checksum line: $line"
            }
            $target = Join-Path $root $Matches[2]
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Source checksum target is missing: $($Matches[2])"
            }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) {
              throw "Source checksum mismatch: $($Matches[2])"
            }
          }

  publish:
    name: Publish V21 release
    if: github.ref == 'refs/tags/v21'
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build self-contained release archive
        shell: pwsh
        run: |
          $release = Resolve-Path 'releases/qlcplus-control-one/v21'
          $dist = New-Item -ItemType Directory -Force 'dist'
          $archive = Join-Path $dist 'QLCPlus-SoundSwitch-V21-Windows.zip'
          Compress-Archive -Path "$release/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          "$hash  QLCPlus-SoundSwitch-V21-Windows.zip" |
            Set-Content -LiteralPath (Join-Path $dist 'QLCPlus-SoundSwitch-V21-Windows-SHA256.txt') -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: QLC+ SoundSwitch V21
          body_path: releases/qlcplus-control-one/v21/RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: |
            dist/QLCPlus-SoundSwitch-V21-Windows.zip
            dist/QLCPlus-SoundSwitch-V21-Windows-SHA256.txt
